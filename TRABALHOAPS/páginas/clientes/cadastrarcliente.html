<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro de Cliente - Doceria</title>
    <link rel="stylesheet" href="../../styles/cadastro.css">
</head>
<body>
    <a href="../../index.html"><button class="btn-voltar"> ← </button></a>
    <div class="container">
        <h1> Cadastro de Cliente</h1>
        <p class="subtitle">Preencha os dados do produto para se cadastrar na doceria</p>

        <!-- Área de mensagens -->
        <div id="mensagem" class="mensagem"></div>

        <!-- Formulário -->
        <form id="formProduto">
            
            <!-- NOME -->
            <div class="form-group">
                <label for="nome">
                    Nome do Cliente <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome"
                    placeholder="Ex: Jonas"
                    required
                    maxlength="200"
                />
            </div>


            <!-- NUMERO -->
            <div class="form-group">
                <label for="numero">Fone</label>
                <input 
                    type="text" 
                    id="numero" 
                    name="numero"
                    placeholder="Ex: 9 9999-9999"
                    required
                    maxlength="200"
                />
            </div>

            <!-- E-MAIL -->
            <div class="form-group">
                <label for="e-mail">E-mail</label>
                <input 
                    type="text" 
                    id="e-mail" 
                    name="e-mail"
                    placeholder="Ex: Jonas.123@gmail.com"
                    required
                    maxlength="200"
                />
            </div>

            <!-- BOTÕES -->
            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="limparFormulario()">
                     Limpar
                </button>
                <button type="submit" class="btn-primary" id="btnEnviar">
                     Cadastrar 
                </button>
            </div>
        </form>
    </div>

    <script>
        // ========================================
        // CONFIGURAÇÃO
        // ========================================
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        // ========================================
        // MOSTRAR MENSAGEM
        // ========================================
        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;

            // Esconde automaticamente após 5 segundos (exceto erro)
            if (tipo !== 'erro') {
                setTimeout(() => {
                    mensagem.className = 'mensagem';
                }, 5000);
            }
        }
        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log(' Cadastro de Cliente iniciado');
            carregarCategorias();
        });
    </script>
</body>
</html>
