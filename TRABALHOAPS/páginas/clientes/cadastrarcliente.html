<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro de Cliente - Doceria</title>
    <link rel="stylesheet" href="../../styles/cadastro.css">
</head>
<body>
    <a href="../../index.html"><button class="btn-voltar"> ← </button></a>
    <div class="container">
        <h1> Cadastro de Cliente</h1>
        <p class="subtitle">Preencha os dados do produto para se cadastrar na doceria</p>

        <!-- Área de mensagens -->
        <div id="mensagem" class="mensagem"></div>

        <!-- Formulário -->
        <form id="formProduto">
            
            <!-- NOME -->
            <div class="form-group">
                <label for="nome">
                    Nome do Cliente <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome"
                    placeholder="Ex: Jonas"
                    required
                    maxlength="200"
                />
            </div>


            <!-- NUMERO -->
            <div class="form-group">
                <label for="numero">Fone</label>
                <input 
                    type="text" 
                    id="numero" 
                    name="numero"
                    placeholder="Ex: 9 9999-9999"
                    required
                    maxlength="200"
                />
            </div>

            <!-- E-MAIL -->
            <div class="form-group">
                <label for="e-mail">E-mail</label>
                <input 
                    type="text" 
                    id="e-mail" 
                    name="e-mail"
                    placeholder="Ex: Jonas.123@gmail.com"
                    required
                    maxlength="200"
                />
            </div>


            <div class="form-group">
            <label for="cpf">CPF</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                inputmode="numeric"
                autocomplete="off"
                required
            >
            <span class="error-message" id="cpfError">CPF inválido</span>
            </div>

            <!-- BOTÕES -->
            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="limparFormulario()">
                     Limpar
                </button>
                <button type="submit" class="btn-primary" id="btnEnviar">
                     Cadastrar 
                </button>
            </div>
        </form>
    </div>

    <script>
    const cpfInput = document.getElementById('cpf');
    const cpfError = document.getElementById('cpfError');
    const form = document.getElementById('clienteForm');

    // Máscara 000.000.000-00
    function aplicarMascaraCPF(valor) {
        return valor
            .replace(/\D/g, '')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2')
            .slice(0, 14);
    }

    // Validação matemática do CPF
    function validarCPF(cpf) {
        cpf = cpf.replace(/\D/g, '');
        if (cpf.length !== 11) return false;
        if (/^(\d)\1{10}$/.test(cpf)) return false;

        let soma = 0;
        for (let i = 0; i < 9; i++) soma += parseInt(cpf[i]) * (10 - i);
        let resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf[9])) return false;

        soma = 0;
        for (let i = 0; i < 10; i++) soma += parseInt(cpf[i]) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf[10])) return false;

        return true;
    }

    // Flag para garantir que a validação só dispare uma vez ao completar 11 dígitos
    let cpfValidado = false;

    cpfInput.addEventListener('input', (e) => {
        // Aplica a máscara
        e.target.value = aplicarMascaraCPF(e.target.value);

        // Conta apenas os dígitos digitados
        const digitos = e.target.value.replace(/\D/g, '');

        // Enquanto não completar 11 dígitos, limpa estado e reseta flag
        if (digitos.length < 11) {
            e.target.classList.remove('valid', 'invalid');
            cpfError.classList.remove('show');
            cpfValidado = false;
            return;
        }

        // Chegou a 11 dígitos → valida automaticamente (só uma vez por CPF completo)
        if (digitos.length === 11 && !cpfValidado) {
            cpfValidado = true;
            if (validarCPF(digitos)) {
                e.target.classList.remove('invalid');
                e.target.classList.add('valid');
                cpfError.classList.remove('show');
            } else {
                e.target.classList.remove('valid');
                e.target.classList.add('invalid');
                cpfError.classList.add('show');
            }
        }
    });

    // Máscara de telefone (opcional)
    const telInput = document.getElementById('telefone');
    telInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 11);
        if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
        else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
        else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
        else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
        e.target.value = v;
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        // O envio não bloqueia por CPF — a validação já ocorreu na digitação.
        // Mas se quiser garantir segurança extra no submit, descomente abaixo:
        /*
        if (!validarCPF(cpfInput.value)) {
            cpfInput.classList.add('invalid');
            cpfError.classList.add('show');
            cpfInput.focus();
            return;
        }
        */
        console.log('Dados enviados:', {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value,
            cpf: cpfInput.value
        });
        alert('Cadastro finalizado!');
        form.reset();
        cpfInput.classList.remove('valid', 'invalid');
        cpfValidado = false;
    });


        // ========================================
        // CONFIGURAÇÃO
        // ========================================
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        // ========================================
        // MOSTRAR MENSAGEM
        // ========================================
        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;

            // Esconde automaticamente após 5 segundos (exceto erro)
            if (tipo !== 'erro') {
                setTimeout(() => {
                    mensagem.className = 'mensagem';
                }, 5000);
            }
        }
        // ========================================
        // INICIALIZAÇÃO
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            console.log(' Cadastro de Cliente iniciado');
            carregarCategorias();
        });
    </script>
</body>
</html>
