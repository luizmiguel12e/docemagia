<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../styles/menuEmTodos.css">
    <link rel="stylesheet" href="../../styles/telaInicialCliente.css">
    <link rel="stylesheet" href="../../styles/vendas.css">
    <style>
        /* Estilos básicos para garantir exibição correta caso faltem no CSS externo */
        .mensagem { padding: 10px; margin: 15px 0; display: none; border-radius: 4px; }
        .mensagem.sucesso { background: #1dd1a1; color: #fff; display: block; }
        .mensagem.erro { background: #ff6b6b; color: #fff; display: block; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .badge-sim { background: #d4edda; color: #155724; }
        .badge-nao { background: #f8d7da; color: #721c24; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal.aberto { display: flex; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
    <header>
        <img src="../../imagens/logoDaDoceria.png" alt="Logo da doceria" class="logo">
        <div>
            <button class="btn-pesquisa">Buscar</button>
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <main>
        <nav>
            <ul>
                <li><a href="tabela.html">Tabela</a></li>
                <li><a href="estoque.html" class="active">Estoque</a></li>
            </ul>
        </nav>

        <div style="padding: 20px;">
            <h1>Estoque</h1>
            
            <!-- Mensagens de Feedback -->
            <div id="mensagem" class="mensagem"></div>

            <!-- Loading -->
            <div id="loading" style="padding: 20px; text-align: center;">Carregando ingredientes...</div>

            <!-- Tabela de Produtos -->
            <table id="tabelaProdutos" style="width: 100%; border-collapse: collapse; display: none; margin-top: 20px;">
                <thead>
                    <tr style="background: #f1f2f6; text-align: left;">
                        <th style="padding: 10px;">ID</th>
                        <th style="padding: 10px;">Nome</th>
                        <th style="padding: 10px;">Quantidade</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="botao">
            <a href="adicionaringrediente.html" class="adicionar">+</a>
        </div>
    </main>

    <!-- Modal de Edição -->
    <div id="modalEdicao" class="modal">
        <div class="modal-content">
            <h2>✏️ Editar Ingrediente</h2>
            <form id="formEdicao" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="editId">
                
                <div style="margin-bottom: 10px;">
                    <label>Nome:</label>
                    <input type="text" id="editNome" required style="width: 100%; padding: 6px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label>Quantidade:</label>
                    <textarea id="editDescricao" style="width: 100%; padding: 6px;"></textarea>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
